name: Pruebas Unitarias con Maven (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '25' 
        distribution: 'temurin'
        cache: maven

    - name: Ejecutar pruebas con Maven
      run: mvn clean test
      
    - name: Subir reporte de JaCoCo
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-cobertura-jacoco
        path: target/site/jacoco/
        retention-days: 7